name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Organika-Windows
          path: |
            build/Organika_artefacts/Release/VST3/Organika.vst3
            build/Organika_artefacts/Release/Standalone/Organika.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Organika-macOS
          path: |
            build/Organika_artefacts/Release/VST3/Organika.vst3
            build/Organika_artefacts/Release/AU/Organika.component
